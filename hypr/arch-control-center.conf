# Arch Control Center. Подключается одной строкой source из hyprland.conf.
# Удаление: ./install.sh --uninstall

exec-once = arch-control-center --shell

# Повторный запуск просит уже открытую оболочку показать лаунчер или настройки.
bind = SUPER, SPACE, exec, arch-control-center --shell --launcher
bind = SUPER, comma, exec, arch-control-center --shell --settings
# Трёхмерный центр управления. Повторный --overlay закрывает его.
bind = SUPER, D, exec, arch-control-center --center --overlay

windowrulev2 = float, class:^(arch-shell)$
windowrulev2 = noborder, class:^(arch-shell)$
windowrulev2 = noshadow, class:^(arch-shell)$
windowrulev2 = noanim, class:^(arch-shell)$
windowrulev2 = pin, class:^(arch-shell)$

windowrulev2 = float, class:^(arch-launcher)$
windowrulev2 = noborder, class:^(arch-launcher)$
windowrulev2 = noshadow, class:^(arch-launcher)$

windowrulev2 = float, class:^(arch-settings)$
windowrulev2 = center, class:^(arch-settings)$

windowrulev2 = float, class:^(arch-control-center)$
windowrulev2 = fullscreen, class:^(arch-control-center)$
windowrulev2 = noborder, class:^(arch-control-center)$
windowrulev2 = noshadow, class:^(arch-control-center)$
windowrulev2 = noanim, class:^(arch-control-center)$
windowrulev2 = pin, class:^(arch-control-center)$
